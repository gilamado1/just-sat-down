<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Just Sat Down™ — A Marriage Simulator</title>
<style>
html,body{margin:0;height:100%;background:#0d0a14;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.7vh);aspect-ratio:16/9;touch-action:none;cursor:pointer;display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,TAU=Math.PI*2;
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ---------------- audio ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,dur,type,vol,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,freq,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const len=Math.max(1,Math.floor(a.sampleRate*dur));const buf=a.createBuffer(1,len,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||800;const g=a.createGain();g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
const sfx={
 sit(){tone(120,45,.28,'sine',.5);noise(.15,.3,250)},
 ding(){tone(1250,1250,.12,'sine',.25)},
 pop(){noise(.06,.35,2000)},
 tap(){tone(650,650,.045,'square',.1)},
 ring(){for(let i=0;i<4;i++)tone(880,880,.09,'square',.1,i*.19)},
 sigh(){tone(330,130,.95,'sawtooth',.16);noise(.5,.05,400,.12)},
 bigsigh(){tone(300,90,1.6,'sawtooth',.2);noise(.9,.07,300,.2)},
 bark(){noise(.08,.45,900);noise(.08,.4,700,.14)},
 squeak(){tone(500,1100,.12,'sine',.2);tone(1100,430,.16,'sine',.18,.12)},
 chime(){[880,1108,1318,1760].forEach((f,i)=>tone(f,f,.5,'sine',.14,i*.09))},
 sting(){[392,311,262].forEach((f,i)=>tone(f,f*.97,.55,'sawtooth',.14,i*.32))},
 oof(){tone(190,70,.22,'square',.3)},
 thump(){tone(90,40,.2,'sine',.4);noise(.12,.25,200)},
 whir(){tone(90,420,.8,'sawtooth',.18)}
};

/* ---------------- data ---------------- */
const TASKDEFS={
 phone:{prep:'charger',line:'Honey? Your phone is ringing. In the other room. Again.',base:5},
 spider:{prep:'lint',line:'Honey. Do you see that. On the window. I will NOT go near it.',base:7},
 thermo:{prep:'thermo',line:'It is 61 degrees in this house. I measured.',base:6},
 lamp:{prep:null,line:'Hold this lamp. Perfect. Don\u2019t move.',base:5},
 trap:{prep:null,line:'Honey, question. Do I look tired?',base:4.5},
 remote:{prep:'remote',line:'The remote is under a cushion. Somewhere. You know where.',base:6},
 dog:{prep:'bowl',line:'BARNABY HAS THE SHOE. THE GOOD SHOE. KILL HIM. METAPHORICALLY.',base:5},
 chips:{prep:'chips',line:'I bought two kinds of chips. Pick. Now. Which do you like better?',base:5},
 smell:{prep:null,line:'Does this smell weird to you? No pressure. Be honest.',base:6}
};
const TASK_TYPES=Object.keys(TASKDEFS);
const HOTSPOTS=[
 {id:'charger',x:155,y:288,name:'Phone charger'},
 {id:'chips',x:235,y:260,name:'Chips cabinet'},
 {id:'bowl',x:95,y:445,name:'Dog bowl'},
 {id:'thermo',x:335,y:215,name:'Thermostat'},
 {id:'remote',x:770,y:295,name:'Remote spot'},
 {id:'furn',x:890,y:225,name:'Flat-pack furniture'}
];
const RUMOURS={
 charger:'You hear a phone cable rattling around the kitchen.',
 lint:'There is a suspicious lint on the window.',
 thermo:'The thermostat is glowing. Aggressively.',
 remote:'The remote is in the wrong spot. You KNOW it.',
 bowl:'The dog is staring at the bowl. Judgementally.',
 chips:'There is exactly one bag of chips in this house.',
 furn:'The flat-pack furniture is looking at you.'
};
const UPGRADES=[
 {id:'cupholder',name:'Cup Holder',desc:'Start each day with +1 "I Just Sat Down" shield',cost:40,max:2},
 {id:'holster',name:'Remote Holster',desc:'Remote hunts resolve themselves. Finally.',cost:60,max:1},
 {id:'thermo',name:'Smart Thermostat',desc:'The comfy zone is twice as wide',cost:40,max:1},
 {id:'zapper',name:'Bug Zapper',desc:'One-tap spider justice',cost:50,max:1},
 {id:'eject',name:'Couch Ejector Seat',desc:'Once/day: blast EVERY request away (+10 sigh)',cost:80,max:1}
];

/* ---------------- state ---------------- */
const G={
 mode:'title', t:0, day:1,
 peaceOfDay:0, totalPeace:0, pp:0, strikes:0, sigh:0, combo:0,
 shield:0, ejectLeft:0,
 prepT:0, prepped:{}, todayPool:[], rumours:[],
 husband:{x:70,y:380,vx:0,vy:0,stop:0,seen:false,squeaked:{}},
 dashT:0, drag:false, dragPos:null,
 sitT:0, strikeT:0,
 relaxT:0, spawnT:0, tasks:[], floats:[],
 dayPrevented:0, dayResolved:0,
 line:null,
 best:+(localStorage.getItem('jsd_best')||0),
 titleArt:null
};
const U={cupholder:0,holster:0,thermo:0,zapper:0,eject:0};
let btns=[];

function float(x,y,text,color){G.floats.push({x,y,text,t:1.6,color:color||'#fff'})}
function showLine(text){G.line={text,t:2.8}}
function updateBest(){if(G.totalPeace>G.best){G.best=G.totalPeace;localStorage.setItem('jsd_best',Math.floor(G.best))}}

/* ---------------- flow ---------------- */
function startGame(){G.day=1;G.totalPeace=0;G.pp=0;G.strikes=0;startDay()}
function startDay(){
 G.mode='prep';G.prepT=15;G.peaceOfDay=0;G.sigh=0;G.combo=0;
 G.shield=1+U.cupholder;G.ejectLeft=U.eject?1:0;
 G.prepped={};G.dayPrevented=0;G.dayResolved=0;G.tasks=[];G.floats=[];G.line=null;
 const n=Math.min(TASK_TYPES.length,4+G.day);
 G.todayPool=shuffle(TASK_TYPES.slice()).slice(0,n);
 G.rumours=[];
 for(const t of G.todayPool){const p=TASKDEFS[t].prep;if(p&&G.rumours.length<3)G.rumours.push(p)}
 if(Math.random()<.45)G.rumours.push('furn');
 G.rumours=shuffle(G.rumours).slice(0,3);
}
function startDash(){G.mode='dash';G.dashT=0;G.husband={x:70,y:380,vx:0,vy:0,stop:0,seen:false,squeaked:{}};G.dragPos=null;showLine('GET TO THE COUCH')}
function startRelax(){G.mode='relax';G.relaxT=Math.max(40,65-G.day*2);G.spawnT=1.2;G.tasks=[];G.sigh=Math.min(G.sigh,50);showLine('You sat down. It is glorious. It will not last.')}
function endDay(){
 G.mode='dayend';G.tasks=[];updateBest();sfx.chime();
}
function rankFor(p){if(p<15)return'COUCH POTATO (AT RISK)';if(p<30)return'DOMESTIC PEASANT';if(p<45)return'CERTIFIED CHAIR GUARDIAN';if(p<59)return'DOMESTIC ORACLE';return'NIRVANA ACHIEVED'}
function doStrike(){
 G.strikes++;G.sigh=0;G.combo=0;G.tasks=[];
 if(G.strikes>=3){G.mode='talk';updateBest();sfx.sting()}
 else{G.mode='strike';G.strikeT=2.6;G.relaxT=Math.max(5,G.relaxT-5);sfx.bigsigh()}
}

/* ---------------- tasks ---------------- */
function spawnTask(){
 let type=G.todayPool.length?G.todayPool.shift():pick(TASK_TYPES);
 const def=TASKDEFS[type];
 const scale=Math.max(.55,1-G.day*.05);
 const card=G.tasks.length===0?0:1;
 let s={};
 if(type==='phone'){s={drag:false,startX:0,shake:0}}
 if(type==='spider'){s={x:35,y:45,need:U.zapper?1:2,hits:0}}
 if(type==='thermo'){s={a:0,speed:2.1+G.day*.14,zoneC:R(0,TAU),zoneW:U.thermo?1.9:.95}}
 if(type==='lamp'){s={w:0,holding:false,timer:4}}
 if(type==='trap'){s={}}
 if(type==='remote'){s={taps:0,need:8,pop:0}}
 if(type==='dog'){s={x:25,speed:52+G.day*3,hits:0,need:3}}
 if(type==='chips'){s={}}
 if(type==='smell'){s={pos:0,dir:1,speed:70+G.day*5}}
 const t={type,card,x:card===0?110:550,y:185,t:def.base*scale,max:def.base*scale,def,s};
 G.tasks.push(t);showLine(def.line);
 if(type==='phone')sfx.ring();
 if(type==='dog')sfx.bark();
 if(type==='thermo')sfx.ding();
 if(type==='remote'&&U.holster){float(t.x+150,t.y+60,'Holster engaged...','#8fd3ff');setTimeout(()=>{if(t===G.tasks.find(x=>x===t))resolveTask(t,'Found it in the holster. Of course.')},900)}
}
function removeTask(t){const i=G.tasks.indexOf(t);if(i>=0)G.tasks.splice(i,1)}
function resolveTask(t,msg){
 const bonus=10*Math.min(G.combo+1,4);
 G.pp+=bonus;G.combo++;G.dayResolved++;
 sfx.ding();float(t.x+150,t.y+45,(msg||'Resolved ')+(' +'+bonus),'#7dff9b');
 removeTask(t);
}
function failTask(t,msg){
 G.combo=0;G.sigh=Math.min(100,G.sigh+25);
 sfx.sigh();float(t.x+150,t.y+45,msg||'\u2026','#ff6b8a');
 removeTask(t);
}
function useShield(){
 if(G.shield<=0||!G.tasks.length)return;
 G.shield--;sfx.pop();
 const t=G.tasks[0];
 float(t.x+150,t.y+60,'"I LITERALLY JUST SAT DOWN"','#ffd23e');
 removeTask(t);
}
function useEject(){
 if(G.ejectLeft<=0||!G.tasks.length)return;
 G.ejectLeft--;G.sigh=Math.min(100,G.sigh+10);sfx.whir();
 for(const t of G.tasks.slice())float(t.x+150,t.y+60,'EJECTED','#8fd3ff');
 G.tasks=[];G.combo=0;
}
function inCard(t,p){return p.x>=t.x&&p.x<=t.x+300&&p.y>=t.y&&p.y<=t.y+215}
function taskDown(t,p){
 const lx=p.x-t.x,ly=p.y-t.y,s=t.s;
 if(t.type==='phone'){if(dist(lx,ly,150,95)<48){s.drag=true;s.startX=p.x}}
 else if(t.type==='spider'){if(dist(lx,ly,s.x,s.y)<28){s.hits++;sfx.tap();if(s.hits>=s.need)resolveTask(t,'Swatted. It was a spider. You screamed a little.')}else sfx.tap()}
 else if(t.type==='thermo'){
   if(dist(lx,ly,150,95)<60){
     const d=((s.a-s.zoneC)%TAU+TAU*1.5)%TAU-Math.PI;
     if(Math.abs(d)<s.zoneW/2)resolveTask(t,'Locked at 72. She nods, once.');
     else{G.sigh=Math.min(100,G.sigh+5);sfx.oof();float(t.x+150,t.y+60,'BZZT. Wrong temp.','#ff6b8a')}
   }
 }
 else if(t.type==='lamp'){s.holding=true}
 else if(t.type==='trap'){
   if(lx>80&&lx<175&&ly>135&&ly<175||lx>185&&lx<280&&ly>135&&ly<175){
     G.sigh=Math.min(100,G.sigh+20);sfx.sigh();
     float(t.x+150,t.y+60,'You KNEW it.','#ff6b8a');removeTask(t);
   }
 }
 else if(t.type==='remote'){if(lx>80&&lx<220&&ly>85&&ly<160){s.taps++;sfx.tap();s.pop=.2;if(s.taps>=s.need)resolveTask(t,'Found it. Under the third cushion. Again.')}}
 else if(t.type==='dog'){if(dist(lx,ly,s.x,110)<34){s.hits++;sfx.bark();s.pop=.2;if(s.hits>=s.need)resolveTask(t,'Shoe recovered. Barnaby: 0, You: 1.')}}
 else if(t.type==='chips'){
   if(dist(lx,ly,90,95)<50||dist(lx,ly,210,95)<50){G.sigh=Math.min(100,G.sigh+8);sfx.pop();resolveTask(t,'\u2026I was hoping for "you".')}
 }
 else if(t.type==='smell'){
   if(lx>100&&lx<200&&ly>150&&ly<190){
     if(s.pos>90&&s.pos<130)resolveTask(t,'You sniffed with authority.');
     else{G.sigh=Math.min(100,G.sigh+5);sfx.oof();float(t.x+150,t.y+60,'\u201c\u2026is that the freezer?\u201d','#ff6b8a')}
   }
 }
}
function taskUp(t){if(t.type==='phone')t.s.drag=false;if(t.type==='lamp')t.s.holding=false}
function taskMove(t,p){
 const s=t.s;
 if(t.type==='phone'&&s.drag&&s.startX-p.x>120)resolveTask(t,'Swiped across the room. Efficient.');
}
function updateTask(t,dt){
 const s=t.s;
 if(t.type==='spider'){
   const dx=270-s.x,dy=175-s.y,L=Math.hypot(dx,dy);s.x+=dx/L*32*dt;s.y+=dy/L*32*dt;
   if(dist(s.x,s.y,270,175)<10)failTask(t,'The lint was real. It was a spider.');
 }
 else if(t.type==='thermo'){s.a=(s.a+s.speed*dt)%TAU}
 else if(t.type==='lamp'){
   s.timer-=dt;
   if(s.holding)s.w*=Math.pow(.02,dt);
   else s.w+=(Math.sin(G.t*4.7)+Math.sin(G.t*2.3))*0.28*dt;
   if(Math.abs(s.w)>0.7)failTask(t,'CLATTER. The lamp. The good lamp.');
   else if(s.timer<=0)resolveTask(t,'\u201cDon\u2019t put it down.\u201d \u201cI will.\u201d \u201c\u2026Fine.\u201d');
 }
 else if(t.type==='remote'){s.pop=Math.max(0,s.pop-dt)}
 else if(t.type==='dog'){s.x+=s.speed*dt;s.pop=Math.max(0,(s.pop||0)-dt);if(s.x>292)failTask(t,'The good shoe is gone. The hallway smells of victory.')}
 else if(t.type==='smell'){s.pos+=s.dir*s.speed*dt;if(s.pos>220){s.pos=220;s.dir=-1}if(s.pos<0){s.pos=0;s.dir=1}}
 t.t-=dt;
 if(t.t<=0){
   const fails={phone:'She went to get her own phone. It was RIGHT THERE.',spider:'',thermo:'She put on a sweater. A sweater.',lamp:'',trap:'Silence. The worst kind.',remote:'It was in her hand. It was in her hand the whole time.',dog:'',chips:'You didn\u2019t answer. The silence was an answer.',smell:''};
   failTask(t,fails[t.type]||'\u2026');
 }
}

/* ---------------- update ---------------- */
function update(dt){
 G.t+=dt;
 G.floats=G.floats.filter(f=>{f.t-=dt;f.y-=30*dt;return f.t>0});
 if(G.line){G.line.t-=dt;if(G.line.t<=0)G.line=null}
 btns=[];
 const h=G.husband;
 if(G.mode==='prep'){
   G.prepT-=dt;if(G.prepT<=0)startDash();
 }
 else if(G.mode==='dash'){
   G.dashT+=dt;
   if(h.stop>0)h.stop-=dt;
   let ax=0,ay=0;
   if(G.drag&&G.dragPos&&h.stop<=0){
     const d=dist(h.x,h.y,G.dragPos.x,G.dragPos.y);
     if(d>14){ax=(G.dragPos.x-h.x)/d;ay=(G.dragPos.y-h.y)/d}
   }
   if(keys.has('a')||keys.has('arrowleft'))ax-=1;
   if(keys.has('d')||keys.has('arrowright'))ax+=1;
   if(keys.has('w')||keys.has('arrowup'))ay-=1;
   if(keys.has('s')||keys.has('arrowdown'))ay+=1;
   const al=Math.hypot(ax,ay);if(al>0){ax/=al;ay/=al}
   h.x=clamp(h.x+ax*240*dt,30,930);h.y=clamp(h.y+ay*240*dt,180,470);
   const dog={x:390+150*Math.sin(G.dashT*.8),y:405};
   const kid={x:470+110*Math.sin(G.dashT*1.4+1),y:372+32*Math.sin(G.dashT*2.3)};
   if(dist(h.x,h.y,dog.x,dog.y)<38){sfx.oof();h.x-=Math.sign(h.x-dog.x||1)*70;h.y-=Math.sign(h.y-dog.y||1)*70;h.stop=.35;G.sigh=Math.min(100,G.sigh+10);float(h.x,h.y-50,'OOF!','#ff6b8a')}
   if(dist(h.x,h.y,kid.x,kid.y)<30){sfx.oof();h.x-=Math.sign(h.x-kid.x||1)*50;h.y-=Math.sign(h.y-kid.y||1)*50;h.stop=.3;G.sigh=Math.min(100,G.sigh+8);float(kid.x,kid.y-40,'HEY!','#ff6b8a')}
   if(dist(h.x,h.y,565,435)<38&&h.stop<=0){sfx.thump();h.stop=.6;h.y-=60;float(565,400,'Laundry basket. Of course.','#ffd23e')}
   for(const [x0,x1] of [[320,400],[500,590],[670,730]]){
     if(h.x>x0&&h.x<x1&&h.y>350&&!h.squeaked[x0]){h.squeaked[x0]=true;sfx.squeak();showLine('\u2026that floorboard.')}
   }
   if(!h.seen){
     const wx=480,wy=140,dx=h.x-wx,dy=h.y-wy,d=Math.hypot(dx,dy);
     if(d<300&&Math.abs(Math.atan2(dx,dy))<.36){h.seen=true;G.sigh=Math.min(100,G.sigh+8);showLine('She saw you walk past. No reason given.')}
   }
   if(Math.abs(h.x-800)<70&&Math.abs(h.y-400)<80){G.mode='sit';G.sitT=1.3;sfx.sit();showLine('\u201cOoh. Finally.\u201d')}
 }
 else if(G.mode==='sit'){
   G.sitT-=dt;if(G.sitT<=0)startRelax();
 }
 else if(G.mode==='strike'){
   G.strikeT-=dt;if(G.strikeT<=0){G.mode='relax';G.spawnT=2}
 }
 else if(G.mode==='relax'){
   G.relaxT-=dt;G.peaceOfDay+=dt;G.totalPeace+=dt;G.pp+=dt;
   if(G.sigh>=100){doStrike();return}
   G.sigh=Math.max(0,G.sigh-4*dt);
   if(G.tasks.length<2){G.spawnT-=dt;if(G.spawnT<=0){spawnTask();G.spawnT=Math.max(2.2,6.5-G.day*.4)*R(.8,1.2)}}
   for(const t of G.tasks.slice())updateTask(t,dt);
   if(G.sigh>=100){doStrike();return}
   if(G.relaxT<=0)endDay();
 }
}

/* ---------------- input ---------------- */
const keys=new Set();
addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();const p=ptr(e);ac();
 for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(!b.disabled&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.cb();return}}
 if(G.mode==='title'){startGame();return}
 if(G.mode==='prep'){
   for(const hs of HOTSPOTS){
     if(dist(p.x,p.y,hs.x,hs.y)<36&&!G.prepped[hs.id]){
       G.prepped[hs.id]=true;sfx.ding();
       const idx=G.todayPool.map(t=>TASKDEFS[t].prep).indexOf(hs.id);
       if(hs.id==='furn'){float(hs.x,hs.y-40,'It was never going to be a problem.','#8fd3ff')}
       else if(idx>=0){
         const toRemove=[];G.todayPool.forEach((t,i)=>{if(TASKDEFS[t].prep===hs.id)toRemove.push(i)});
         toRemove.reverse().forEach(i=>G.todayPool.splice(i,1));
         G.dayPrevented+=toRemove.length;G.pp+=5*toRemove.length;
         float(hs.x,hs.y-40,'PREVENTED +'+(5*toRemove.length),'#7dff9b');
       } else float(hs.x,hs.y-40,'Prepped. Probably.','#8fd3ff');
       break;
     }
   }
   return;
 }
 if(G.mode==='dash'){G.drag=true;G.dragPos=p;return}
 if(G.mode==='relax'){
   for(const t of G.tasks.slice()){if(inCard(t,p)){taskDown(t,p);break}}
 }
});
cv.addEventListener('pointermove',e=>{
 const p=ptr(e);
 if(G.mode==='dash')G.dragPos=p;
 if(G.mode==='relax')for(const t of G.tasks.slice())if(inCard(t,p)){taskMove(t,p);break}
});
addEventListener('pointerup',e=>{
 G.drag=false;
 if(G.mode==='relax')for(const t of G.tasks.slice())if(inCard(t,ptr(e)))taskUp(t);
});

/* ---------------- drawing helpers ---------------- */
function btn(x,y,w,h,label,cb,disabled){
 btns.push({x,y,w,h,cb,disabled});
 ctx.save();
 ctx.fillStyle=disabled?'#2a2438':(cb?'#274060':'#274060');
 rr(x,y,w,h,10);ctx.fill();

   c.save();
   c.fillStyle='#274060';rr(100,150,100,34,8);c.fill();c.strokeStyle='#5a8fd8';c.lineWidth=2;rr(100,150,100,34,8);c.stroke();
   c.fillStyle='#cfe4ff';c.font='bold 14px system-ui';c.textAlign='center';c.fillText('SNIFF',150,168);
   c.restore();
 }
 c.restore();
}

/* ---------------- screens ---------------- */
function renderTitle(){
 const c=ctx;
 c.fillStyle='#0d0a14';c.fillRect(0,0,W,H);
 if(G.titleArt){
   // cover-fit the 16:9 art
   c.globalAlpha=.9;c.drawImage(G.titleArt,0,0,W,H);c.globalAlpha=1;
   const g=c.createLinearGradient(0,0,0,H);
   g.addColorStop(0,'rgba(13,10,20,.55)');g.addColorStop(.35,'rgba(13,10,20,.12)');
   g.addColorStop(.62,'rgba(13,10,20,.12)');g.addColorStop(1,'rgba(13,10,20,.78)');
   c.fillStyle=g;c.fillRect(0,0,W,H);
   const pulse=1+Math.sin(G.t*3)*.03;
   c.save();c.translate(480,95);c.scale(pulse,pulse);
   bigText('JUST SAT DOWN',0,0,56,'#ffd23e');
   c.restore();
   bigText('\u2122 A MARRIAGE SIMULATOR \u2122',480,145,19,'#e8d5ff');
   if(G.best>0)bigText('Best peace: '+Math.floor(G.best)+'s',480,205,16,'#7dff9b');
   if(Math.sin(G.t*4)>-0.2)bigText('TAP TO BEGIN',480,300,26,'#fff');
   bigText('Prep the house \u2192 dash to the couch \u2192 defend the peace',480,430,14,'#cfe4ff');
   btn(380,460,200,50,'START A MARRIAGE',startGame);
 } else {
   drawCouch(480,470,true);
   drawHusband(480,438,'sit');
   drawWife(640,438,1.1,true);
   const pulse=1+Math.sin(G.t*3)*.03;
   c.save();c.translate(480,150);c.scale(pulse,pulse);
   bigText('JUST SAT DOWN',0,-18,58,'#ffd23e');
   c.restore();
   bigText('\u2122 A MARRIAGE SIMULATOR \u2122',480,205,20,'#e8d5ff');
   bigText('One thumb. Sixty seconds. Zero escape.',480,240,18,'#8fd3ff');
   if(G.best>0)bigText('Best peace: '+Math.floor(G.best)+'s',480,272,16,'#7dff9b');
   if(Math.sin(G.t*4)>-0.2)bigText('TAP TO BEGIN',480,330,26,'#fff');
   bigText('Prep the house \u2192 dash to the couch \u2192 defend the peace',480,420,13,'#5a5470');
   btn(380,450,200,50,'START A MARRIAGE',startGame);
 }
}
function renderPrep(){
 drawHouse();
 const c=ctx;
 drawCouch(800,438,true);
 // hotspots
 for(const hs of HOTSPOTS){
   const done=G.prepped[hs.id];
   c.save();
   const r=30+Math.sin(G.t*4+hs.x)*3;
   c.fillStyle=done?'rgba(125,255,155,.15)':'rgba(255,210,62,.12)';
   c.beginPath();c.arc(hs.x,hs.y,r,0,TAU);c.fill();
   c.strokeStyle=done?'#7dff9b':'#ffd23e';c.lineWidth=2.5;c.setLineDash(done?[]:[6,6]);
   c.beginPath();c.arc(hs.x,hs.y,26,0,TAU);c.stroke();c.setLineDash([]);
   c.font='20px system-ui';c.textAlign='center';c.textBaseline='middle';
   const icon={charger:'\ud83d\udcf1',chips:'\ud83c\udf2a',bowl:'\ud83d\udc36',thermo:'\ud83c\udf21\ufe0f',remote:'\ud83d\udcd9',furn:'\ud83e\udde6'}[hs.id]||'\u2b50';
   c.fillText(icon,hs.x,hs.y-4);
   c.font='bold 11px system-ui';c.fillStyle=done?'#7dff9b':'#ffd23e';
   c.fillText(hs.name,hs.x,hs.y+22);
   if(done){c.font='bold 22px system-ui';c.fillStyle='#7dff9b';c.fillText('\u2713',hs.x+22,hs.y-20)}
   c.restore();
 }
 drawHUD('');
 bigText('PREP PHASE \u2014 stop it BEFORE it happens',480,64,18,'#8fd3ff');
 // rumours ticker
 c.fillStyle='rgba(12,9,20,.85)';rr(120,450,720,70,12);c.fill();
 c.font='13px system-ui';c.textAlign='center';c.fillStyle='#e8d5ff';
 G.rumours.forEach((r,i)=>c.fillText('\ud83d\udd0d '+RUMOURS[r],480,470+i*18,690));
 const canGo=true;
 btn(790,360,150,44,'TO THE COUCH \u2192',startDash,!canGo);
 bigText(Math.ceil(G.prepT)+'s',865,340,20,'#ffd23e');
 // husband at kitchen
 drawHusband(52,432,'stand',0);
}
function renderDash(){
 drawHouse();
 const c=ctx;
 const h=G.husband;
 const dog={x:390+150*Math.sin(G.dashT*.8),y:405};
 const kid={x:470+110*Math.sin(G.dashT*1.4+1),y:372+32*Math.sin(G.dashT*2.3)};
 // gaze cone
 c.fillStyle='rgba(255,80,120,.10)';
 c.beginPath();c.moveTo(480,140);
 c.lineTo(480-Math.tan(.36)*300,140+300);c.lineTo(480+Math.tan(.36)*300,140+300);c.closePath();c.fill();
 drawWife(480,140,.8,h.seen?false:true);
 // basket
 c.fillStyle='#5a7a9a';rr(545,410,40,50,6);c.fill();
 c.fillStyle='#cfe4ff';c.fillRect(549,404,32,10);
 drawDog(dog.x,dog.y,G.dashT);
 drawKid(kid.x,kid.y,G.dashT);
 drawCouch(800,438,true);
 drawHusband(h.x,h.y,'stand',G.drag?1:0);
 if(G.drag&&G.dragPos){
   c.strokeStyle='rgba(125,255,155,.4)';c.lineWidth=2;c.setLineDash([4,6]);
   c.beginPath();c.arc(G.dragPos.x,G.dragPos.y,10,0,TAU);c.stroke();c.setLineDash([]);
 }
 drawHUD('');
 bigText('GET TO THE COUCH',480,64,20,'#ffd23e');
 bigText('drag him (or WASD). dodge Barnaby, the kid, the laundry, and HER GAZE.',480,88,12,'#5a5470');
 drawFloats();
 drawLine();
}
function renderSit(){
 drawRelaxBG();
 drawCouch(480,470,true);
 const p=1-clamp(G.sitT/1.3,0,1);
 drawHusband(480,470+Math.sin(p*Math.PI)*-14,'sit');
 drawHUD('');
 drawLine();
}
function renderStrike(){
 drawRelaxBG();
 drawCouch(480,470,false);
 drawHusband(480,470,'sit');
 drawWife(620,440,1.2,false);
 drawHUD('');
 const c=ctx;
 c.fillStyle='rgba(10,6,14,.75)';c.fillRect(0,0,W,H);
 bigText('\u201cFINE.\u201d',480,190,64,'#ff4d6d');
 bigText('\u201cI\u2019LL DO IT MYSELF.\u201d',480,260,34,'#fff');
 bigText('STRIKE '+G.strikes+' OF 3 \u2014 you lose 5s of peace',480,330,16,'#8fd3ff');
}
function renderRelax(){
 drawRelaxBG();
 drawCouch(480,470,true);
 drawHusband(480,470,'sit');
 if(G.line)drawWife(700,120,.75,true);
 drawHUD(Math.ceil(G.relaxT)+'s until \u201cwe need to talk\u201d');
 for(const t of G.tasks)drawCard(t);
 if(G.combo>1)bigText('COMBO \u00d7'+Math.min(G.combo+1,4),480,150,20,'#ffd23e');
 drawShieldBtns();
 drawFloats();
 drawLine();
}
function renderDayEnd(){
 const c=ctx;
 c.fillStyle='#0d0a14';c.fillRect(0,0,W,H);
 drawCouch(480,480,true);
 bigText('END OF DAY '+G.day,480,70,34,'#ffd23e');
 bigText(rankFor(G.peaceOfDay),480,120,26,'#7dff9b');
 bigText('Peace this day: '+Math.floor(G.peaceOfDay)+'s',480,165,18,'#fff');
 bigText('Prevented: '+G.dayPrevented+'   Resolved: '+G.dayResolved,480,192,15,'#8fd3ff');
 bigText('Total peace: '+Math.floor(G.totalPeace)+'s    PP: '+Math.floor(G.pp),480,220,16,'#e8d5ff');
 // shop
 c.fillStyle='#e8d5ff';c.font='bold 15px system-ui';c.textAlign='center';
 c.fillText('THE COUCH EMPORIUM',480,262);
 let y=285;
 for(const u of UPGRADES){
   const owned=U[u.id];
   const maxed=owned>=u.max;
   const canBuy=!maxed&&G.pp>=u.cost;
   c.textAlign='left';
   c.fillStyle=maxed?'#5a5470':'#fff';c.font='bold 14px system-ui';
   c.fillText(u.name+(owned? ' \u00d7'+owned:''),180,y+8);
   c.fillStyle='#8a84a0';c.font='12px system-ui';
   c.fillText(u.desc,180,y+26);
   btn(640,y-4,150,36,maxed?'OWNED':u.cost+' PP',function(){
     if(!maxed&&G.pp>=u.cost){G.pp-=u.cost;U[u.id]++;sfx.ding()}
   },!canBuy);
   y+=52;
 }
 btn(380,505,200,32,'NEXT DAY \u2192',()=>{G.day++;startDay()});
}
function renderTalk(){
 const c=ctx;
 c.fillStyle='#07050c';c.fillRect(0,0,W,H);
 c.fillStyle='#241d33';c.fillRect(0,470,W,70);
 drawWife(170,470,1.45,true);
 bigText('WE NEED TO TALK.',480,90,52,'#ff4d6d');
 bigText('(it will take 45 minutes. there is no skip button.)',480,135,16,'#8fd3ff');
 bigText('Final peace: '+Math.floor(G.totalPeace)+'s',480,195,22,'#fff');
 bigText('Days survived: '+G.day,480,228,18,'#e8d5ff');
 bigText('Best peace: '+Math.floor(G.best)+'s'+(Math.floor(G.totalPeace)>=Math.floor(G.best)&&G.totalPeace>0?' \u2014 NEW RECORD':''),480,258,18,'#7dff9b');
 bigText('Cause of death: '+G.strikes+' unspoken sighs.',480,300,15,'#5a5470');
 btn(380,360,200,50,'START A NEW MARRIAGE',startGame);
}
function render(){
 btns=[];
 if(G.mode==='title')renderTitle();
 else if(G.mode==='prep')renderPrep();
 else if(G.mode==='dash')renderDash();
 else if(G.mode==='sit')renderSit();
 else if(G.mode==='relax')renderRelax();
 else if(G.mode==='strike')renderStrike();
 else if(G.mode==='dayend')renderDayEnd();
 else if(G.mode==='talk')renderTalk();
}

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt);
 render();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* test hooks */
(function(){
  try{
    const img=new Image();
    img.onload=()=>G.titleArt=img;
    img.onerror=()=>G.titleArt=null;
    img.src='art/title.jpg';
  }catch(e){}
})();
window.G=G;window.U=U;window.startGame=startGame;window.startDay=startDay;
window.startDash=startDash;window.startRelax=startRelax;window.spawnTask=spawnTask;
window.resolveTask=resolveTask;window.failTask=failTask;window.doStrike=doStrike;
window.endDay=endDay;window.useShield=useShield;window.useEject=useEject;
window.debug={setSigh:v=>G.sigh=v,setStrikes:v=>G.strikes=v,forceSpawn:t=>{G.todayPool.unshift(t);spawnTask()}};
</script>
