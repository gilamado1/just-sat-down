<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JUST SAT DOWN™ — A Marriage Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#1a1214; overflow:hidden; font-family:'Nunito',sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:100%; height:100%; max-width:560px; background:#2b1d20; overflow:hidden;
           box-shadow:0 0 80px rgba(0,0,0,.8); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* HUD */
  #hud { position:absolute; top:0; left:0; right:0; padding:10px 14px; display:none; z-index:5;
         pointer-events:none; text-align:center; }
  .bar-label { font-size:11px; font-weight:800; letter-spacing:1px; color:#ffe9c9; text-shadow:0 2px 0 #000; margin-bottom:2px; }
  .bar { height:14px; background:#00000088; border:2px solid #000; border-radius:8px; overflow:hidden; margin:0 auto 6px; position:relative; }
  .bar > div { height:100%; width:0%; border-radius:6px; transition:width .15s; }
  #relaxFill { background:linear-gradient(90deg,#ffd93d,#6bff8f); }
  #sighFill  { background:linear-gradient(90deg,#ff9d5c,#ff4d4d); width:0%; }
  #dayLabel { font-family:'Bangers',cursive; font-size:22px; color:#fff; text-shadow:0 3px 0 #000, 0 0 14px #ff8c00; letter-spacing:2px; }
  /* Speech bubble */
  #bubble { position:absolute; left:50%; bottom:26%; transform:translateX(-50%) scale(0); max-width:86%;
            background:#fff; border:3px solid #000; border-radius:18px; padding:12px 18px; z-index:6;
            font-family:'Bangers',cursive; font-size:24px; color:#111; text-align:center; line-height:1.15;
            transition:transform .18s cubic-bezier(.34,1.56,.64,1); box-shadow:0 6px 0 #00000055; }
  #bubble.show { transform:translateX(-50%) scale(1); }
  #bubble:after { content:''; position:absolute; bottom:-16px; left:50%; margin-left:-8px;
                  border:8px solid transparent; border-top-color:#000; }
  /* Mini-game choice buttons */
  #choices { position:absolute; left:0; right:0; bottom:6%; display:none; flex-wrap:wrap; gap:10px;
             justify-content:center; z-index:7; padding:0 20px; }
  #choices button { font-family:'Bangers',cursive; font-size:20px; letter-spacing:1px; padding:12px 20px;
             background:#ffd93d; border:3px solid #000; border-radius:14px; box-shadow:0 5px 0 #000;
             cursor:pointer; color:#111; transition:transform .08s; min-width:120px; }
  #choices button:active { transform:translateY(4px); box-shadow:0 1px 0 #000; }
  #choices button.wrong { background:#ff6b6b; animation:shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  /* Screens */
  .screen { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center;
            justify-content:flex-end; text-align:center; padding:20px; }
  #titleScreen { background:url('art/title.png') center/cover no-repeat; }
  #overScreen  { background:url('art/gameover.png') center/cover no-repeat; display:none; }
  .scrim { position:absolute; inset:0; background:linear-gradient(transparent 30%, rgba(0,0,0,.85)); }
  .screen .inner { position:relative; z-index:2; width:100%; }
  h1 { font-family:'Bangers',cursive; font-size:min(15vw,72px); color:#ffd93d; letter-spacing:3px;
       text-shadow:0 4px 0 #000, 0 0 30px #ff8c0088, 0 8px 0 #00000066; line-height:.95; }
  .sub { color:#fff; font-weight:800; font-size:15px; text-shadow:0 2px 0 #000; margin:8px 0 4px; }
  .bigbtn { font-family:'Bangers',cursive; font-size:28px; letter-spacing:2px; background:#ff4d6d; color:#fff;
       border:4px solid #000; border-radius:18px; padding:14px 40px; box-shadow:0 7px 0 #000; cursor:pointer;
       margin-top:14px; transition:transform .08s; }
  .bigbtn:active { transform:translateY(5px); box-shadow:0 2px 0 #000; }
  #statLine { color:#ffe9c9; font-size:14px; font-weight:800; text-shadow:0 2px 0 #000; margin-top:6px; }
  #overTitle { font-size:min(12vw,56px); color:#ff4d4d; text-shadow:0 4px 0 #000, 0 0 30px #f0055; }
  #overQuote { font-family:'Bangers',cursive; color:#fff; font-size:22px; text-shadow:0 3px 0 #000; margin-top:4px; }
  .tiny { font-size:11px; color:#ffffff99; margin-top:10px; }
  /* floating +score / damage text */
  .floaty { position:absolute; font-family:'Bangers',cursive; font-size:26px; z-index:8; pointer-events:none;
            text-shadow:0 3px 0 #000; animation:floatUp 1s ease-out forwards; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-70px)} }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="dayLabel">DAY 1</div>
    <div class="bar-label">😌 RELAX-O-METER™</div>
    <div class="bar" style="width:70%"><div id="relaxFill"></div></div>
    <div class="bar-label">😤 SIGH METER</div>
    <div class="bar" style="width:70%"><div id="sighFill"></div></div>
  </div>

  <div id="bubble"></div>
  <div id="choices"></div>

  <div class="screen" id="titleScreen">
    <div class="scrim"></div>
    <div class="inner">
      <h1>JUST SAT<br>DOWN™</h1>
      <div class="sub">How long can you enjoy the couch?</div>
      <button class="bigbtn" id="startBtn">SAT DOWN</button>
      <div id="statLine"></div>
      <div class="tiny">Best peace streak: <span id="bestLine">0.0s</span></div>
      <div class="tiny">She will ask for something. Tap the yellow button. Hold when it says HOLD.</div>
      <div class="tiny"><a href="index.html" style="color:#ffe9c9">all three games</a></div>
    </div>
  </div>

  <div class="screen" id="overScreen">
    <div class="scrim"></div>
    <div class="inner">
      <h1 id="overTitle">MARRIAGE OVER</h1>
      <div id="overQuote"></div>
      <div class="sub" id="overStats"></div>
      <button class="bigbtn" id="retryBtn">SIT BACK DOWN</button>
      <div class="tiny"><a href="index.html" style="color:#ffe9c9">all three games</a></div>
    </div>
  </div>
</div></div>

<script>
// ============================== SETUP ==============================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W=560, H=800;
function resize(){
  W = stage.clientWidth; H = stage.clientHeight;
  cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
const hud=$('hud'), bubble=$('bubble'), choicesEl=$('choices');
const relaxFill=$('relaxFill'), sighFill=$('sighFill'), dayLabel=$('dayLabel');

// ============================== AUDIO (WebAudio, no files) ==============================
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f, dur=.15, type='square', vol=.12, when=0, slide=0){
  const a=ac(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur=.3, vol=.2, when=0){
  const a=ac(), len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol; s.connect(g).connect(a.destination); s.start(a.currentTime+when);
}
const SFX = {
  sit:    ()=>{ tone(220,.12,'sine',.15); tone(330,.15,'sine',.12,.08); },
  hon:    ()=>{ tone(880,.09,'square',.2); tone(660,.09,'square',.2,.1); tone(880,.14,'square',.2,.2); },
  good:   ()=>{ tone(523,.09,'square',.12); tone(659,.09,'square',.12,.08); tone(784,.18,'square',.12,.16); },
  bad:    ()=>{ tone(200,.2,'sawtooth',.15,0,-120); },
  sigh:   ()=>{ noise(.7,.12); tone(300,.7,'sine',.06,0,-180); },
  sitdown:()=>{ noise(.12,.25); tone(90,.15,'sine',.2); },
  boss:   ()=>{ [0,.2,.4,.65].forEach((t,i)=>tone([196,233,196,155][i],.3,'sawtooth',.14,t)); },
  win:    ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.12,i*.09)); }
};

// ============================== GAME DATA ==============================
// Task types: choice (pick answer, may be trap), tap (tap N times), hold (keep pressing), fetch (wait for bar)
const TASKS = [
  { day:1,  text:"The remote. It's in the couch. You live here.", type:'fetch', label:"DIG IN THE CUSHIONS", dur:1.5, ok:"It was under you. The whole time." },
  { day:1,  text:"Does this smell weird?", type:'choice',
    opts:["Fine","Weird","*sniff*"], answer:2,
    ok:"So you smell it too. Great.", note:"There was no safe answer." },
  { day:2,  text:"Hold this. Perfect. Don't breathe on it.", type:'hold', label:"HOLD. DON'T MOVE.", dur:2.2,
    ok:"A little left. Okay never mind. Sit." },
  { day:2,  text:"Can you reach the thing? The THING.", type:'choice',
    opts:["Remote?","Scissors?","...the thing?"], answer:-1, alwaysWrong:true,
    ok:"Not that. I got it. Why did I ask.", note:"It was never knowable." },
  { day:3,  text:"KILL IT. KILL IT.", type:'tap', label:"SWAT IT", taps:8,
    ok:"Lint. Thank you for screaming." },
  { day:3,  text:"One or two. Pick. Now.", type:'choice',
    opts:["1","2","You"], answer:2,
    ok:"Hmm.", note:"Flattery. The only door." },
  { day:4,  text:"Do I look tired?", type:'choice',
    opts:["No. Radiant.","A little.","..."], answer:-1, alwaysWrong:true, instant:true,
    ok:"Wow.", note:"No survival path." },
  { day:4,  text:"My phone. Other room. Urgent.", type:'fetch', label:"GO GET THE PHONE", dur:1.8,
    ok:"Thanks. 4%. Whatever." },
  { day:5,  text:"The story. The WHOLE story.", type:'hold', label:"KEEP NODDING", dur:2.8,
    ok:"...and THAT'S why Karen. Sit." },
  { day:5,  text:"Couch. Two inches left.", type:'tap', label:"LIFT", taps:10,
    ok:"Right. RIGHT. Back. Perfect." },
  { day:6,  text:"Taste this. Be honest.", type:'choice',
    opts:["Perfect","Too salty","Needs salt"], answer:-1, alwaysWrong:true,
    ok:"You have no palate.", note:"Be honest was the trap." },
  { day:6,  text:"Wi-Fi is dead. You. Fix it.", type:'fetch', label:"UNPLUG THE ROUTER", dur:2.0,
    ok:"It's back. It missed you." },
  { day:7,  text:"Where do you want to eat. Do not say I don't care.", type:'choice',
    opts:["I don't care","Wherever you want","Tacos"], answer:3,
    ok:"Not tacos. Forget it.", note:"Tacos was wrong." },
  { day:8,  text:"Hold him. He JUST went down.", type:'hold', label:"DO NOT BREATHE", dur:3.2,
    ok:"He's up. I'll take him." },
  { day:9,  text:"This outfit. Say it.", type:'choice',
    opts:["Gorgeous","Comfortable","It's great"], answer:1,
    ok:"Comfortable. Comfortable.", note:"Three options. Zero correct." },
  { day:10, text:"Assemble this. Instructions are a vibe.", type:'tap', label:"BUILD", taps:12,
    ok:"One screw left. That's normal." },
];

const SIGH_LINES = ["*deep sigh*","HOOOOON-ey?","BAAAABE.","Oh, never mind...","*THE SIGH*"];
const OVER_QUOTES = [
  "You never sat down. You hovered.",
  "The couch filed a missing person report.",
  "It could wait. It never waits.",
  "The lint won."
];

// ============================== STATE ==============================
let G = null;
function newGame(){
  return {
    mode:'idle',        // idle | relaxing | calling | task | boss | over
    day:1, taskIdx:0,
    relax:0, relaxMax:100,
    sigh:0, sighMax:100,
    peaceTotal:0, peaceStreak:0, bestStreak: parseFloat(localStorage.jsd_best||"0"),
    tasksToday:0, tasksNeeded:2,
    callTimer:0, callDelay:4.0,
    task:null, taskProg:0, taskTime:0,
    husband:{x:.5, y:.72, vx:0, vy:0, onCouch:true, tx:.5, ty:.72},
    wifePos:0, // 0 offscreen right, 1 in room
    bob:0, shake:0, hint:0,
  };
}

// ============================== INPUT ==============================
let pressing=false, tapBursts=0, timers=[];
function later(fn, ms){ const id=setTimeout(fn, ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function pressStart(){ pressing=true; if(G&&G.mode==='task'&&G.task&&G.task.type==='tap'){ tapBursts++; SFX.sitdown(); } }
function pressEnd(){ pressing=false; }
stage.addEventListener('pointerdown', e=>{ if(e.target.tagName!=='BUTTON') pressStart(); });
addEventListener('pointerup', pressEnd);
addEventListener('pointercancel', pressEnd);
addEventListener('blur', pressEnd);
addEventListener('keydown', e=>{ if(e.code==='Space'&&!e.repeat){ e.preventDefault(); pressStart(); } });
addEventListener('keyup',   e=>{ if(e.code==='Space') pressEnd(); });

// ============================== FLOW ==============================
function showBubble(txt, ms){
  bubble.textContent = txt; bubble.classList.add('show');
  clearTimeout(bubble._t);
  if(ms) bubble._t = later(()=>bubble.classList.remove('show'), ms);
}
function hideBubble(){ bubble.classList.remove('show'); }

function floaty(txt, color){
  const el=document.createElement('div'); el.className='floaty'; el.textContent=txt; el.style.color=color;
  el.style.left=(30+Math.random()*40)+'%'; el.style.top='40%';
  stage.appendChild(el); later(()=>el.remove(), 1000);
}

function startGame(){
  clearTimers();
  G = newGame();
  G.hint = 3.2;
  $('titleScreen').style.display='none';
  $('overScreen').style.display='none';
  hud.style.display='block';
  ac();
  SFX.sit();
  startRelax();
}

function startRelax(){
  G.mode='relaxing';
  G.tasksNeeded = 2 + Math.floor(G.day/3);
  if(G.tasksToday === undefined) G.tasksToday = 0;
  G.callDelay = Math.max(1.2, 4.5 - G.day*0.28);
  G.callTimer = G.callDelay;
  hideBubble(); choicesEl.style.display='none';
  dayLabel.textContent = 'DAY '+G.day;
  SFX.sitdown();
}

function wifeCalls(){
  G.mode='calling';
  SFX.hon();
  G.shake = 8;
  const t = TASKS[G.taskIdx % TASKS.length];
  G.task = t; G.taskIdx++;
  showBubble(t.text);
  later(showTask, 1400);
}

function showTask(){
  if(!G || G.mode!=='calling') return;
  G.mode='task'; G.taskProg=0; G.taskTime=0; tapBursts=0;
  const t=G.task;
  choicesEl.innerHTML=''; choicesEl.style.display='flex';
  if(t.type==='choice'){
    const order=[...t.opts.keys()].sort(()=>Math.random()-.5);
    order.forEach(i=>{
      const b=document.createElement('button'); b.textContent=t.opts[i];
      b.onclick=()=>answer(i,b); choicesEl.appendChild(b);
    });
  } else {
    const b=document.createElement('button');
    b.textContent = t.type==='hold' ? t.label+' (HOLD)' : t.type==='tap' ? t.label+' (MASH)' : t.label+' (HOLD)';
    b.onpointerdown=e=>{ e.stopPropagation(); pressStart(); };
    b.onpointerup=e=>{ e.stopPropagation(); pressEnd(); };
    b.onpointercancel=e=>{ e.stopPropagation(); pressEnd(); };
    choicesEl.appendChild(b);
  }
}

function answer(i, btn){
  const t=G.task;
  choicesEl.querySelectorAll('button').forEach(b=>b.disabled=true);
  if(t.answer===i){ // correct (rare)
    taskDone(true);
  } else {
    btn.classList.add('wrong');
    SFX.bad();
    if(t.instant){ gameOver("Do I look tired?"); return; }
    addSigh(30);
    floaty("WRONG","#ff4d4d");
    showBubble(t.ok, 1800);
    later(()=>taskDone(false), 1200);
  }
}

function taskDone(success){
  hideBubble(); choicesEl.style.display='none';
  G.tasksToday++;
  if(success){ G.peaceStreak += 3; floaty("+3s PEACE","#6bff8f"); SFX.good(); }
  else { addSigh(15); G.peaceStreak = Math.max(0,G.peaceStreak-2); }
  if(G.tasksToday >= G.tasksNeeded){
    // day complete -> bonus relax
    G.relax = Math.min(G.relaxMax, G.relax+25);
    floaty("DAY SURVIVED","#ffd93d"); SFX.win();
    G.day++;
    G.tasksToday = 0;
    later(startRelax, 900);
    G.mode='idle';
  } else {
    startRelax();
  }
  if(G.peaceStreak > G.bestStreak){ G.bestStreak=G.peaceStreak; localStorage.jsd_best=G.bestStreak; }
}

function addSigh(n){
  G.sigh = Math.min(G.sighMax, G.sigh+n);
  SFX.sigh();
  if(G.sigh>=G.sighMax) gameOver("Fine. I'll do it myself.");
}

function gameOver(reason){
  if(!G || G.mode==='over') return;
  clearTimers();
  pressing=false;
  G.mode='over';
  SFX.boss();
  hud.style.display='none'; hideBubble(); choicesEl.style.display='none';
  $('overTitle').textContent = "WE NEED TO TALK";
  $('overQuote').textContent = '"'+reason+'"';
  $('overStats').textContent = `Survived ${G.day-1} day(s) · Total peace: ${G.peaceTotal.toFixed(1)}s · Best streak: ${G.bestStreak.toFixed(1)}s`;
  $('overScreen').style.display='flex';
}

// ============================== UPDATE ==============================
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G) update(dt);
  draw(now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  G.bob += dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);

  if(G.mode==='relaxing'){
    // THE COUCH. BLISS.
    G.relax += dt*6;
    G.peaceTotal += dt; G.peaceStreak += dt;
    if(G.peaceStreak>G.bestStreak){ G.bestStreak=G.peaceStreak; localStorage.jsd_best=G.bestStreak; }
    G.callTimer -= dt;
    if(G.callTimer<=0) wifeCalls();
    if(G.relax>=G.relaxMax){ // NIRVANA
      G.relax=0; G.peaceTotal+=10; floaty("NIRVANA +10s","#ffd93d"); SFX.win();
    }
  }
  if(G.mode==='relaxing' && G.hint>0){ G.hint-=dt; }
  if(G.mode==='task' && G.task){
    G.relax = Math.max(0, G.relax - dt*10);
    const t=G.task; G.taskTime+=dt;
    const limit = t.type==='choice' ? 7 : (t.type==='hold' ? t.dur+5 : 7);
    if(t.type==='tap'){
      G.taskProg = tapBursts/t.taps;
      if(tapBursts>=t.taps){ SFX.good(); showBubble(t.ok,1600); G.mode='idle'; later(()=>taskDone(true),900); }
    }
    if(t.type==='hold' || t.type==='fetch'){
      if(pressing){ G.taskProg+=dt/t.dur; }
      else if(t.type==='hold'){ G.taskProg=Math.max(0,G.taskProg-dt*0.25); }
      if(G.taskProg>=1){ SFX.good(); showBubble(t.ok,1600); G.mode='idle'; later(()=>taskDone(true),900); }
    }
    if(G.mode==='task' && G.taskTime>limit){
      if(t.instant){ gameOver("Do I look tired?"); }
      else { addSigh(22); showBubble(t.ok||'Too slow.',1400); G.mode='idle'; later(()=>taskDone(false),800); }
    }
  }
  // UI bars
  relaxFill.style.width = Math.min(100,(G.relax/G.relaxMax*100))+'%';
  sighFill.style.width  = (G.sigh/G.sighMax*100)+'%';
}

// ============================== DRAW ==============================
function draw(t){
  ctx.save();
  if(G&&G.shake>0) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  // room
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#4a3a2e'); g.addColorStop(.6,'#5c4636'); g.addColorStop(1,'#3d2c22');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // floor
  ctx.fillStyle='#7a5c3e'; ctx.fillRect(0,H*.62,W,H*.38);
  ctx.strokeStyle='#6b4f34'; ctx.lineWidth=2;
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,H*.66+i*26); ctx.lineTo(W,H*.63+i*26); ctx.stroke(); }
  // rug
  ctx.fillStyle='#8f4b3f'; ctx.beginPath(); ctx.ellipse(W/2,H*.8,W*.42,H*.09,0,0,7); ctx.fill();
  ctx.strokeStyle='#c46b5c'; ctx.lineWidth=4; ctx.stroke();
  // lamp
  ctx.fillStyle='#3a2a1c'; ctx.fillRect(W*.08,H*.30,10,H*.34);
  ctx.fillStyle='#ffd98a'; ctx.beginPath(); ctx.moveTo(W*.08-34,H*.32); ctx.lineTo(W*.08+44,H*.32); ctx.lineTo(W*.08+28,H*.16); ctx.lineTo(W*.08-18,H*.16); ctx.fill();
  if(G&&G.mode==='relaxing'){ ctx.globalAlpha=.15+Math.sin(t*3)*.05; ctx.fillStyle='#ffe9b0'; ctx.beginPath(); ctx.arc(W*.08,H*.3,90,0,7); ctx.fill(); ctx.globalAlpha=1; }
  // plant
  ctx.fillStyle='#a0522d'; ctx.fillRect(W*.85,H*.52,26,40);
  ctx.fillStyle='#3e7c3e';
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(W*.87+Math.cos(i*1.3)*22,H*.5+Math.sin(i*1.3)*18,14,26,i,0,7); ctx.fill(); }
  // doorway (right)
  ctx.fillStyle='#2a1c12'; ctx.fillRect(W*.72,H*.12,W*.22,H*.5);
  ctx.fillStyle='#1c120a'; ctx.fillRect(W*.74,H*.14,W*.18,H*.48);
  // wife in doorway
  if(G && (G.mode==='calling'||G.mode==='task'||G.mode==='boss')){
    const wx=W*.83, wy=H*.30+Math.sin(t*10)*2;
    ctx.fillStyle='#111'; // silhouette
    ctx.beginPath(); ctx.arc(wx,wy-38,16,0,7); ctx.fill(); // head
    ctx.beginPath(); ctx.moveTo(wx-20,wy+40); ctx.quadraticCurveTo(wx,wy-30,wx+20,wy+40); ctx.fill(); // dress
    // pointing arm
    ctx.strokeStyle='#111'; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(wx-8,wy-20); ctx.lineTo(wx-70,wy-34+Math.sin(t*14)*4); ctx.stroke();
    // angry marks
    ctx.strokeStyle='#ff4d4d'; ctx.lineWidth=3;
    for(let i=0;i<3;i++){ const a=t*8+i*2.1; ctx.beginPath();
      ctx.moveTo(wx+Math.cos(a)*26,wy-38+Math.sin(a)*26);
      ctx.lineTo(wx+Math.cos(a)*34,wy-38+Math.sin(a)*34); ctx.stroke(); }
  }
  // COUCH
  const cx=W*.5, cy=H*.72;
  ctx.fillStyle='#8f3b2f'; ctx.beginPath(); ctx.roundRect(cx-W*.3,cy-70,W*.6,110,20); ctx.fill();
  ctx.fillStyle='#a8462f'; ctx.beginPath(); ctx.roundRect(cx-W*.3,cy-70,W*.6,44,18); ctx.fill(); // backrest
  ctx.fillStyle='#7c3226'; // cushions
  ctx.beginPath(); ctx.roundRect(cx-W*.28,cy-30,W*.26,44,12); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+W*.02,cy-30,W*.26,44,12); ctx.fill();
  // plaid pattern
  ctx.strokeStyle='#00000022'; ctx.lineWidth=3;
  for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(cx-W*.28+i*W*.075,cy-30); ctx.lineTo(cx-W*.28+i*W*.075,cy+16); ctx.stroke(); }
  // HUSBAND
  if(G){
    const hx=cx, hy=cy-52+Math.sin(G.bob*(G.mode==='relaxing'?2:6))*3;
    // body
    ctx.fillStyle='#e8863a'; ctx.beginPath(); ctx.ellipse(hx,hy+18,30,26,0,0,7); ctx.fill();
    // head
    ctx.fillStyle='#f2b98a'; ctx.beginPath(); ctx.arc(hx,hy-8,20,0,7); ctx.fill();
    // hair
    ctx.fillStyle='#5a3a1e'; ctx.beginPath(); ctx.arc(hx,hy-14,19,Math.PI,0); ctx.fill();
    // face
    if(G.mode==='relaxing'){
      ctx.strokeStyle='#333'; ctx.lineWidth=2.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(hx-7,hy-8,4,.2,2.9); ctx.stroke(); // happy closed eyes
      ctx.beginPath(); ctx.arc(hx+7,hy-8,4,.2,2.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx,hy+2,6,.3,2.8); ctx.stroke(); // smile
      // halo
      ctx.strokeStyle='#ffe066'; ctx.lineWidth=4; ctx.globalAlpha=.6+Math.sin(t*4)*.3;
      ctx.beginPath(); ctx.ellipse(hx,hy-42,22,7,0,0,7); ctx.stroke(); ctx.globalAlpha=1;
      // Zzz
      ctx.fillStyle='#ffffffcc'; ctx.font='16px Bangers';
      ctx.fillText('z',hx+30,hy-24); ctx.font='12px Bangers'; ctx.fillText('z',hx+42,hy-36);
    } else {
      // alarmed eyes
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(hx-7,hy-8,6,0,7); ctx.arc(hx+7,hy-8,6,0,7); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(hx-7,hy-7,3,0,7); ctx.arc(hx+7,hy-7,3,0,7); ctx.fill();
      ctx.strokeStyle='#333'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(hx,hy+6,5,3.4,6); ctx.stroke(); // :o mouth
    }
  }
  // task progress ring
  if(G && G.mode==='task' && G.task && G.task.type!=='choice'){
    ctx.strokeStyle='#00000066'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.arc(W/2,H*.5,46,0,7); ctx.stroke();
    ctx.strokeStyle='#6bff8f'; ctx.lineWidth=10; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(W/2,H*.5,46,-Math.PI/2,-Math.PI/2+G.taskProg*2*Math.PI); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='20px Bangers'; ctx.textAlign='center';
    const lbl = G.task.type==='tap' ? (tapBursts+'/'+G.task.taps) :
                G.task.type==='hold' ? 'HOLD!' : 'HOLD TO FETCH';
    ctx.fillText(lbl, W/2, H*.5+7); ctx.textAlign='left';
  }
  // relax aura when relaxing
  if(G && G.mode==='relaxing'){
    ctx.fillStyle='#ffffff10';
    ctx.beginPath(); ctx.arc(cx,cy,90+Math.sin(t*2)*8,0,7); ctx.fill();
    if(G.hint>0){
      ctx.globalAlpha=Math.min(1,G.hint);
      ctx.fillStyle='#ffe9c9'; ctx.font='22px Bangers'; ctx.textAlign='center';
      ctx.fillText('SIT. ENJOY IT.', W/2, H*.22);
      ctx.font='14px Nunito'; ctx.fillText('When the bubble pops, tap the yellow button.', W/2, H*.26);
      ctx.textAlign='left'; ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

// ============================== BUTTONS ==============================
$('startBtn').onclick = startGame;
$('retryBtn').onclick = startGame;
$('bestLine').textContent = parseFloat(localStorage.jsd_best||"0").toFixed(1)+'s';
</script>
